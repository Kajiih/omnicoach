[package]
name = "omni-lint"
version = "0.1.0"
edition = "2024"
description = "Lightweight, high-signal static analysis and command linter for Python and Rust"
license = "MIT"
repository = "https://github.com/Kajiih/omni-lint"
readme = "README.md"
keywords = ["linter", "static-analysis", "ast-grep", "python", "rust"]
categories = ["development-tools", "command-line-utilities"]
default-run = "omni-code-lint"
autobins = false
include = ["/src/**", "/README.md", "/LICENSE"]

[lib]
name = "omni"
path = "src/lib.rs"

[[bin]]
name = "omni-code-lint"
path = "src/bin/omni-code-lint.rs"

[[bin]]
name = "omni-command-lint"
path = "src/bin/omni-command-lint.rs"

[[example]]
name = "ast_dumper"
path = "src/bin/ast_dumper.rs"

[profile.release]
lto = "fat"
strip = "symbols"


[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "deny"
missing_docs = "deny"
unused = { level = "deny", priority = -1 }
dead_code = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
panic = "deny"
unimplemented = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.1", features = ["preserve_order"] }
ast-grep-core = "0.45" # SOTA structural search using tree-sitter
ast-grep-language = "0.45"
shell-words = "1.1" # Safe shell tokenization for cmd guard
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
line-index = "0.1.2"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"
globset = "0.4"
rayon = "1.12"
indoc = "2.0.7"

[dev-dependencies]
assert_cmd = "2.0"
insta = "1.48"
predicates = "3.0"
pretty_assertions = "1.4.0"
rstest = "0.27"
tempfile = "3.27"
