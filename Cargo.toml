[package]
name = "omni"
version = "0.1.0"
edition = "2021"
authors = ["Development Team"]
publish = false


[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "deny"
missing_docs = "deny"
unused = { level = "deny", priority = -1 }
dead_code = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
panic = "deny"
unimplemented = "deny"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
ast-grep-core = "0.45" # SOTA structural search using tree-sitter
ast-grep-language = "0.45"
shell-words = "1.1" # Safe shell tokenization for cmd guard
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
ignore = "0.4"
line-index = "0.1.2"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"
globset = "0.4"

[dev-dependencies]
assert_cmd = "2.0"
indoc = "2.0.7"
insta = "1.38.0"
predicates = "3.0"
pretty_assertions = "1.4.0"
rstest = "0.27"
tempfile = "3.10.1"
