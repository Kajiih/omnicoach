[package]
name = "omnicoach-playground"
version = "0.1.0"
edition = "2024"
description = "WebAssembly request/response entrypoint for the omnicoach playground"
readme = "../README.md"
repository = "https://github.com/Kajiih/omnicoach"
license = "MIT"
keywords = ["linter", "python", "rust", "static-analysis", "wasm"]
categories = ["development-tools", "wasm"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
omnicoach = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
