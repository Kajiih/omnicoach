[package]
name = "omnicoach-playground"
version = "0.1.0"
edition = "2021"
publish = false
description = "WebAssembly request/response entrypoint for the omnicoach playground"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
omnicoach = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
